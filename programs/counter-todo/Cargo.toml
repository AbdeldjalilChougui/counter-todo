[package]
name = "counter-todo"
version = "0.1.0"
description = "Created with Anchor"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "counter_todo"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []


[dependencies]
anchor-lang = "1.2.0"

[dev-dependencies]
litesvm = "0.16.0"
solana-message = "4.2"
solana-transaction = "4.1"
solana-signer = "3.0.0"
solana-keypair = "3.0.1"
solana-instruction = "3"
solana-transaction-error = "3"


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
